[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-integrity"
version = "0.1.0"
description = "Offline checks for temporal causality, point-in-time contract lives, and file integrity."
authors = [{ name = "Nassim Berrahmane" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
quant-integrity = "quant_integrity.cli:main"

[tool.setuptools.packages.find]
include = ["quant_integrity*"]
